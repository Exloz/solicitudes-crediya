server:
  port: "${APP_PORT:8081}"
spring:
  application:
    name: "${APP_NAME:LoanRequest}"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: "${DB_PORT:5433}"
    database: "${DB_NAME:solicitudes_db}"
    schema: "public"
    username: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:password123}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "*"
springdoc:
  api-docs:
    path: "/api-docs"
  swagger-ui:
    path: "/swagger-ui.html"
    operationsSorter: "method"
adapter:
  restconsumer:
    timeout: "${REST_CONSUMER_TIMEOUT:5000}"
    url: "${REST_CONSUMER_URL:http://localhost:8080}"
  sqs:
    region: "${AWS_REGION}"
    queueNotificationsUrl: "${SQS_QUEUE_NOTIFICATIONS_URL}"
    queueDebtRequestsUrl: "${SQS_QUEUE_DEBT_REQUEST_URL}"
resilience4j:
  circuitbreaker:
    instances:
      getUserById:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
jwt:
  public-key-path: "${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}"
entrypoint:
  sqs:
    region: "us-east-1"
#    endpoint: "http://localhost:4566"
    queueDebtResponseUrl: "${SQS_QUEUE_DEBT_RESPONSE_URL}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
