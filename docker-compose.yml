services:
  request-postgres:
    image: postgres:15-alpine
    container_name: solicitudes-crediya-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT_INTERNAL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - ${NETWORK_NAME}
    restart: no
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build:
      context: ./deployment
      dockerfile: Dockerfile
    container_name: solicitudes-crediya-app
    env_file:
      - .env
    environment:
      DB_HOST: "${DB_HOST:-postgres}"
    ports:
      - "${APP_PORT}:${APP_PORT}"
    depends_on:
      request-postgres:
        condition: service_healthy
    networks:
      - ${NETWORK_NAME}
    restart: no

volumes:
  postgres_data:

networks:
  crediya-network:
    external: true
    name: crediya-net
